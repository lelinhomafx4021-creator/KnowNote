# 本地开发数据库：PostgreSQL 16 + pgvector
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knownote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: knownote
      POSTGRES_PASSWORD: knownote
      POSTGRES_DB: knownote
    ports:
      - "5432:5432"
    volumes:
      - knownote-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knownote -d knownote"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  knownote-pgdata:
